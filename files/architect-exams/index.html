<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>築題｜建築師考古題練習室</title><style>
:root{--ink:#182b28;--muted:#687772;--paper:#f6f4ee;--card:#fffefa;--line:#dce2d9;--green:#345e4d;--lime:#e5edcf;--rust:#ad593e;--shadow:0 16px 50px #22352b13}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px}button,select{font:inherit}button{cursor:pointer}.shell{max-width:1230px;margin:auto;padding:0 32px}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.08em}.mark{width:34px;height:34px;background:var(--green);border-radius:11px;color:#f4f3e9;display:grid;place-items:center;font:18px Georgia}.top-right{font-size:12px;color:var(--muted)}.hero{padding:54px 0 32px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.18em;color:var(--rust);font-weight:800}.hero h1{font:500 clamp(34px,5vw,55px)/1.17 Georgia,"Noto Serif TC",serif;letter-spacing:-.04em;margin:12px 0}.hero p{color:var(--muted);margin:0}.session{border:1px solid var(--line);border-radius:14px;padding:12px 17px;color:var(--muted);font-size:12px;white-space:nowrap}.session b{color:var(--ink);font-size:15px;display:block;margin-bottom:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 25px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font:26px Georgia,serif;margin:7px 0 2px}.stat small{color:#8b9690;font-size:11px}.main{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}.side,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.side{padding:21px;position:sticky;top:16px}.side h3{font-size:14px;margin:0 0 17px}.label{display:block;color:var(--muted);font-size:11px;margin:17px 0 8px}.side select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fffefa;color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:transparent;padding:7px 10px;border-radius:99px;font-size:11px;color:var(--muted)}.chip.on{background:var(--lime);border-color:#ccd8b7;color:#294939}.primary{background:var(--green);border:0;color:#fffefa;border-radius:10px;padding:12px 15px;width:100%;font-weight:700;margin-top:20px}.primary:disabled{opacity:.45;cursor:not-allowed}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px}.tiny{font-size:11px;line-height:1.65;color:var(--muted);margin-top:16px}.workspace{min-width:0}.tabs{display:flex;gap:5px;padding:5px;background:#eeeee7;border-radius:12px;width:max-content;margin-bottom:14px}.tab{border:0;background:transparent;padding:9px 15px;border-radius:9px;color:var(--muted);font-size:12px}.tab.active{background:#fffefa;color:var(--ink);box-shadow:0 2px 8px #22352b12}.panel{padding:25px;min-height:390px}.panel-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.tag{background:var(--lime);padding:6px 10px;border-radius:99px;color:#385744}.progress{height:4px;background:#e9ece5;border-radius:9px;margin:18px 0 26px;overflow:hidden}.progress i{height:100%;display:block;background:var(--green);transition:width .3s}.qno{font-size:11px;letter-spacing:.12em;color:var(--rust);font-weight:800}.question{font:500 23px/1.65 "Noto Serif TC","Microsoft JhengHei",serif;margin:11px 0 22px;white-space:pre-line}.options{display:grid;gap:9px}.option{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;line-height:1.6}.option:hover{border-color:#91a58f;background:#fbfcf6}.option.selected{border-color:var(--green);background:#f0f4eb}.letter{flex:none;border:1px solid var(--line);border-radius:7px;width:25px;height:25px;text-align:center;line-height:23px;font-size:11px;color:var(--muted)}.option.correct{border-color:#71a57b;background:#edf6ed}.option.wrong{border-color:#d2866f;background:#fbefeb}.option.correct .letter{background:#4d805b;color:white;border-color:#4d805b}.option.wrong .letter{background:var(--rust);color:white;border-color:var(--rust)}.explain{margin-top:15px;padding:13px 15px;border-radius:10px;background:#f2f2eb;font-size:13px;line-height:1.7;color:#50615b}.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.note{font-size:11px;color:var(--muted)}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.empty h2{color:var(--ink);font:26px Georgia}.review{border-top:1px solid var(--line);padding:17px 0}.review h4{font-size:14px;margin:0 0 9px}.review p{font-size:13px;line-height:1.7;color:var(--muted);margin:4px 0}.review .ans{color:var(--green)}.review .yours{color:var(--rust)}.review button{margin-top:9px}.bookmark{border:0;background:transparent;color:var(--muted);font-size:18px}.bookmark.saved{color:var(--rust)}.foot{text-align:center;color:#8d9791;font-size:10px;padding:24px 0 36px}.results{display:grid;grid-template-columns:155px 1fr;gap:25px;align-items:center}.score{height:140px;width:140px;border-radius:50%;border:9px solid var(--lime);display:grid;place-items:center;text-align:center}.score strong{font:42px Georgia;display:block}.score span{font-size:11px;color:var(--muted)}
@media(max-width:800px){.shell{padding:0 17px}.hero{padding:36px 0 24px;display:block}.session{display:inline-block;margin-top:17px}.stats{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.side{position:static}.panel{padding:19px}.results{grid-template-columns:1fr}.score{height:120px;width:120px}.question{font-size:20px}.top-right{display:none}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">築</div><span>築題 <span style="font-weight:400;color:#78847c">/ ARCHITECT EXAM STUDIO</span></span></div><div class="top-right">離線練習・進度自動儲存於此裝置</div></header><section class="hero"><div><div class="eyebrow">Past papers · Practice room</div><h1>把每一題，變成<br>下一步的把握。</h1><p>建築師考古題模擬練習｜依年度、科目與題型自在練習</p></div><div class="session"><b id="today">—</b>本次練習</div></section><div class="stats"><div class="stat"><span>累積作答</span><strong id="s-attempt">0</strong><small>題練習紀錄</small></div><div class="stat"><span>答對題數</span><strong id="s-right">0</strong><small>持續累積中</small></div><div class="stat"><span>答對率</span><strong id="s-rate">—</strong><small>依已作答題目計算</small></div><div class="stat"><span>待複習</span><strong id="s-wrong">0</strong><small>已收藏錯題</small></div></div><main class="main"><aside class="side"><h3>設定你的練習</h3><span class="label">考試科目</span><select id="subject"></select><span class="label">考試年度</span><select id="year"></select><span class="label">練習模式</span><div class="chips"><button class="chip on" data-mode="all">全部題目</button><button class="chip" data-mode="wrong">錯題複習</button><button class="chip" data-mode="saved">我的收藏</button></div><span class="label">每回合題數</span><select id="count"><option value="5">5 題・快速暖身</option><option value="10" selected>10 題・專注練習</option><option value="20">20 題・完整演練</option><option value="0">全部符合題目</option></select><button class="primary" id="start">開始練習 →</button><div class="tiny">所有題目與作答資料存於此瀏覽器。可離線開啟，不需登入或連線。</div></aside><section class="workspace"><div class="tabs"><button class="tab active" data-view="quiz">練習題目</button><button class="tab" data-view="summary">本次成績</button><button class="tab" data-view="guide">使用說明</button></div><div class="panel" id="content"></div></section></main><footer class="foot">築題・建築師考古題練習室　｜　題目與答案依參考資料整理，實際法規以最新公告為準</footer></div><script>
const S=['建築計畫與設計','建築結構','建築構造與施工','建築環境控制','敷地計畫與都市設計','營建法規與實務'];
const Q=[
{y:112,s:1,q:'鋼筋混凝土梁受彎時，若增加受拉鋼筋量而其他條件不變，下列敘述何者最適當？',o:['梁的開裂彎矩必然大幅增加','梁的極限彎矩提高，但延性可能降低','梁的撓度必然減少至零','混凝土壓力區深度必然減少'],a:1,x:'受拉鋼筋增加通常可提高彎矩承載力，但可能使中性軸加深、壓力控制破壞風險上升，延性需一併檢核。',t:'鋼筋混凝土・梁受彎'},
{y:111,s:1,q:'簡支梁承受跨中集中載重時，最大彎矩通常發生於何處？',o:['左支承處','跨中','距左支承四分之一跨處','全跨彎矩相同'],a:1,x:'對稱簡支梁跨中集中載重的最大正彎矩發生於跨中，大小為 PL/4。',t:'結構力學・剪力與彎矩'},
{y:110,s:1,q:'鋼筋混凝土構件中設置箍筋，主要功能不包括下列何者？',o:['抵抗剪力','拘束核心混凝土','維持主筋位置','直接取代所有受拉主筋'],a:3,x:'箍筋可承擔部分剪力、提供圍束並固定主筋，但不能取代梁柱縱向主筋的主要受力功能。',t:'鋼筋混凝土・箍筋'},
{y:109,s:1,q:'一根兩端簡支、跨距為 L 的梁受均佈載重 w，最大彎矩為何？',o:['wL²/2','wL²/8','wL/2','wL²/12'],a:1,x:'簡支梁全跨均佈載重的最大正彎矩在跨中，Mmax = wL²/8。',t:'結構力學・梁彎矩'},
{y:108,s:1,q:'建築物的耐震設計中，設置韌性構架的主要目的為何？',o:['使構架在地震時完全不變形','藉延性變形消散地震能量並避免脆性破壞','增加建築物自重以降低週期','取消所有非結構構件'],a:1,x:'耐震韌性設計允許結構在可控制範圍內產生延性變形，以消散能量並維持生命安全。',t:'耐震設計・韌性'},
{y:112,s:2,q:'鋼筋混凝土施工時，混凝土澆置前檢查模板與鋼筋，下列何者最直接關係到保護層厚度？',o:['鋼筋墊塊及定位措施','混凝土坍度試驗頻率','施工電梯位置','拆模後表面養護方式'],a:0,x:'澆置前使用適當墊塊、馬椅與定位件，可確保鋼筋與模板間距，維持設計保護層厚度。',t:'鋼筋混凝土施工・保護層'},
{y:111,s:2,q:'下列哪一項最能降低屋頂平面防水層因熱脹冷縮產生裂縫的風險？',o:['取消所有伸縮縫','設置適當分格縫並配合細部收頭','只增加面層厚度','將排水口全部封閉'],a:1,x:'適當分格縫可釋放面層與防水層的溫度變形，並須配合落水口、女兒牆等節點詳圖確保連續防水。',t:'防水工程・伸縮與收頭'},
{y:110,s:2,q:'施工查驗中，混凝土新拌性質常以何種試驗快速評估工作性？',o:['洛杉磯磨耗試驗','坍度試驗','標準貫入試驗','馬歇爾穩定值試驗'],a:1,x:'坍度試驗是評估新拌混凝土工作性與一致性的常用現場方法，仍需搭配配比與其他品質管制。',t:'混凝土工程・工作性'},
{y:109,s:2,q:'鋼構件防火被覆的主要目的為何？',o:['提升鋼材常溫下的抗拉強度','延緩火災升溫、維持一定時間承載能力','完全避免任何火災損害','取代構件防蝕塗裝'],a:1,x:'防火被覆降低鋼構件受熱速率，爭取規定的耐火時間；不代表構件不會受損，也不等同防蝕。',t:'鋼構工程・防火'},
{y:108,s:2,q:'建築外牆採用連續保溫設計（外保溫）的主要優點為何？',o:['避免所有結露情況且無須節點設計','減少熱橋並提升外殼熱工連續性','可取消外牆防水層','一定能降低所有設備容量至零'],a:1,x:'連續外保溫可減少梁柱等部位的熱橋，但窗框、陽台與固定件等熱橋仍須妥善設計。',t:'外殼設計・熱橋'},
{y:112,s:3,q:'室內機械通風時，增加室外新鮮空氣量的首要目的通常為何？',o:['提供稀釋污染物所需的換氣量','直接取代所有空調除濕','保證室內不需任何過濾','令室溫必然等於室外溫度'],a:0,x:'依人數、污染源與使用需求提供足量外氣，可稀釋室內污染物；仍需考慮過濾與溫濕度處理。',t:'室內空氣品質・外氣量'},
{y:111,s:3,q:'改善室內自然採光均勻度，下列方法何者較有效？',o:['只在窗前設置深色吸光面','採用高窗或反射光棚引導日光深入室內','完全取消室內反射面','僅增加透明玻璃面積而不做遮陽'],a:1,x:'高窗與反射光棚可將日光送往室內深處，並應搭配遮陽及眩光控制。',t:'視環境・自然採光'},
{y:110,s:3,q:'遮陽設計中，水平遮陽板通常對哪一種日照較有效？',o:['高角度太陽的直射日光','所有方向的散射光','夜間室外照明','地面反射的聲音'],a:0,x:'水平遮陽對高太陽高度角日照較有效；低角度東西向日光常需垂直或可調式遮陽。',t:'熱環境・外遮陽'},
{y:109,s:3,q:'下列哪一項最可能有效降低空調系統的部分負載能耗？',o:['所有區域全年定風量全新風','依負載調整變頻風機與水泵運轉','取消室溫控制感測器','同時加熱與冷卻同一空間'],a:1,x:'變頻設備能依實際需求調整輸出，降低部分負載時輸送能耗；仍需兼顧室內環境。',t:'空調系統・部分負載'},
{y:108,s:3,q:'提升外窗氣密性後，冬季室內舒適度改善的原因最可能為何？',o:['減少冷風滲入與非計畫換氣','提高玻璃透光率','使太陽輻射完全消失','令室內濕度固定不變'],a:0,x:'提高氣密性可減少非計畫冷風滲入與熱損失；仍須提供受控新鮮外氣維持空氣品質。',t:'熱環境・氣密'},
{y:112,s:4,q:'規劃基地雨水管理時，何種作法最能接近「源頭減量」原則？',o:['全面鋪設不透水硬鋪面','以透水鋪面、雨水花園與滯留設施分散處理','只擴大下游排水管徑','將所有地表逕流集中快速排出'],a:1,x:'增加入滲、滯留與就地利用，可降低尖峰逕流，並應依土壤與地下水條件檢核。',t:'基地規劃・雨水管理'},
{y:111,s:4,q:'都市設計中，連續且具遮蔭的人行空間最直接改善何種環境？',o:['步行舒適性與公共空間連續性','基地容積率自動提升','建築物耐震能力','地下水補注量必然增加'],a:0,x:'騎樓、遮棚與行道樹等連續遮蔭設施可改善步行熱舒適並串聯街道活動。',t:'都市設計・步行環境'},
{y:110,s:4,q:'基地配置建築物時，最應優先確認下列哪一組條件？',o:['僅考慮立面顏色','日照風向、地形水文、出入口與法定退縮','僅考慮停車位數量','僅依鄰棟外牆顏色決定'],a:1,x:'基地配置須整合環境條件、交通動線與法定限制，並依使用需求整體評估。',t:'基地分析・配置'},
{y:109,s:4,q:'步行與自行車動線的規劃，下列何者最符合安全性原則？',o:['穿越主要車道且不設任何視距','減少衝突點、確保視距並連接公共運輸','與貨車裝卸路線完全重疊','只在基地邊界設置單一入口'],a:1,x:'連接公共運輸、降低人車衝突並確保出入口視距，可提升慢行安全。',t:'交通規劃・慢行系統'},
{y:108,s:4,q:'都市開放空間如採用多層次植栽，通常可同時支持何種效益？',o:['生物棲地、微氣候調節與使用者遮蔭','增加熱島效應','阻斷所有無障礙通行','保證不需維護'],a:0,x:'喬木、灌木與地被的多層次配置有助於生態、遮蔭和微氣候調節，仍需考量維護及視線安全。',t:'景觀規劃・植栽'},
{y:112,s:5,q:'建築基地設置無障礙通路時，規劃重點為何？',o:['只在主要入口設置階梯','確保通路連續、無障礙並銜接必要設施','無障礙通路可被停車空間占用','只需設置標誌而不必處理高差'],a:1,x:'無障礙通路須連續銜接出入口與必要設施，並依適用法規檢核坡度、淨寬、高差、防滑等條件；應核對現行條文。',t:'無障礙設計・通路'},
{y:111,s:5,q:'建築物使用類組與防火避難規定的檢討，通常應以何者作為首要依據？',o:['使用執照登載的用途及實際使用情形','外牆塗料顏色','建築師事務所地址','鄰地地價'],a:0,x:'使用用途是判定使用類組、防火與避難規定的重要基礎，實際變更使用亦應檢核法規。',t:'建築法規・用途類組'},
{y:110,s:5,q:'建築物防火區劃設計中，防火門的功能為何？',o:['永久阻止任何煙熱進入','在規定時間內維持區劃完整並抑制火煙蔓延','取代所有避難出口','使避難走廊可作為倉庫'],a:1,x:'防火門須依規定具備防火性能並保持可正常關閉，協助維持防火區劃與避難路徑安全。',t:'防火避難・區劃'},

const L=['A','B','C','D'],$=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),id=q=>`${q.y}-${q.s}-${q.t}-${q.q.slice(0,12)}`;let data={};try{data=JSON.parse(localStorage.getItem('archStudio')||'{}')}catch{}data.history??={};data.saved??=[];let mode='all',view='quiz',round=[],idx=0,answers={},submitted=false;function save(){localStorage.setItem('archStudio',JSON.stringify(data));stats()}function stats(){let a=Object.values(data.history),n=a.length,r=a.filter(x=>x.correct).length;$('#s-attempt').textContent=n;$('#s-right').textContent=r;$('#s-rate').textContent=n?Math.round(100*r/n)+'%':'—';$('#s-wrong').textContent=data.saved.length}function init(){['全部科目',...S].forEach((x,i)=>$('#subject').add(new Option(x,i-1)));['全部年度',...Array.from(new Set(Q.map(q=>q.y))).sort((a,b)=>b-a)].forEach((x,i)=>$('#year').add(new Option(i?x+' 年':x,i?x:0)));$('#today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});stats();empty();$('#start').onclick=start;$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode});$$('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));render()})}function candidates(){let a=Q.filter(q=>(+$('#subject').value<0||q.s===+$('#subject').value)&&(!+$('#year').value||q.y===+$('#year').value));if(mode==='wrong')a=a.filter(q=>data.history[id(q)]?.correct===false);if(mode==='saved')a=a.filter(q=>data.saved.includes(id(q)));return a}function start(){let a=candidates();if(!a.length){$('#content').innerHTML='<div class="empty"><h2>目前沒有符合的題目</h2><p>換個科目、年度，或先收藏幾題再來複習吧。</p></div>';return}a.sort(()=>Math.random()-.5);let n=+$('#count').value;round=n?a.slice(0,n):a;idx=0;answers={};submitted=false;view='quiz';tabs();quiz()}function tabs(){$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view))}function empty(){$('#content').innerHTML='<div class="empty"><div class="eyebrow">Ready when you are</div><h2>先選一科，開始暖身。</h2><p>依歷年考科觀念整理的選擇練習，<br>每題附解析，答完可回顧錯題。</p></div>'}function quiz(){let q=round[idx];if(!q){empty();return}let chosen=answers[idx],saved=data.saved.includes(id(q));$('#content').innerHTML=`<div class="panel-head"><span class="tag">${S[q.s]}</span><button class="bookmark ${saved?'saved':''}" onclick="toggle()" title="收藏">${saved?'♥':'♡'}</button></div><div class="progress"><i style="width:${idx/round.length*100}%"></i></div><div class="qno">${q.y} 年 · ${q.t} · 題 ${idx+1} / ${round.length}</div><div class="question">${q.q}</div><div class="options">${q.o.map((x,j)=>`<div class="option ${chosen===j?'selected':''} ${submitted&&j===q.a?'correct':''} ${submitted&&chosen===j&&j!==q.a?'wrong':''}" onclick="choose(${j})"><span class="letter">${L[j]}</span><span>${x}</span></div>`).join('')}</div>${submitted?`<div class="explain"><b>${chosen===q.a?'答對了，觀念掌握得不錯。':'再看一次核心觀念'}</b><br>${q.x}</div>`:''}<div class="qfoot"><span class="note">${chosen===undefined?'選擇一個最適合的答案':submitted?'已記錄本題結果':'可先作答，再查看解析'}</span><div>${submitted?`<button class="primary" style="width:auto;margin:0;padding:10px 18px" onclick="next()">${idx===round.length-1?'查看成績':'下一題 →'}</button>`:`<button class="primary" style="width:auto;margin:0;padding:10px 18px" onclick="check()" ${chosen===undefined?'disabled':''}>確認答案</button>`}</div></div>`}function choose(j){if(submitted)return;answers[idx]=j;quiz()}function check(){if(answers[idx]===undefined)return;submitted=true;let q=round[idx];data.history[id(q)]={correct:answers[idx]===q.a,answer:answers[idx],year:q.y,subject:q.s};save();quiz()}function next(){if(idx<round.length-1){idx++;submitted=false;quiz()}else{view='summary';tabs();summary()}}function toggle(){let k=id(round[idx]);data.saved.includes(k)?data.saved=data.saved.filter(x=>x!==k):data.saved.push(k);save();quiz()}function summary(){let a=round.map((q,i)=>({q,ans:answers[i],ok:answers[i]===q.a})),n=a.filter(x=>x.ans!==undefined).length,r=a.filter(x=>x.ok).length,p=n?Math.round(100*r/n):0;$('#content').innerHTML=`<div class="results"><div class="score"><div><strong>${p}</strong><span>本次答對率</span></div></div><div><div class="eyebrow">Session complete</div><h2 style="font:29px Georgia;margin:9px 0">完成本回合練習</h2><p style="color:var(--muted);line-height:1.8">答對 <b>${r}</b> 題，作答 <b>${n}</b> 題。${p>=80?'保持這個節奏，繼續累積實力。':p>=50?'很好的練習，查看解析會讓觀念更扎實。':'每次複習都是進步，建議收藏不熟悉的題目。'}</p><button class="primary" style="width:auto" onclick="start()">再練一回合 →</button></div></div><div style="margin-top:28px"><div class="eyebrow" style="margin-bottom:12px">Answer review</div>${a.map(({q,ans,ok},i)=>`<div class="review"><h4>${i+1}. ${q.q}</h4><p class="${ok?'ans':'yours'}">${ans===undefined?'未作答':ok?'✓ 你的答案：'+L[ans]+'　答對':'✕ 你的答案：'+L[ans]}</p><p class="ans">正確答案：${L[q.a]}．${q.o[q.a]}</p><p>${q.x}</p>${!ok?`<button class="ghost" onclick="saveWrong(${i})">♡ 收藏這題</button>`:''}</div>`).join('')}</div>`}function saveWrong(i){let k=id(round[i]);if(!data.saved.includes(k))data.saved.push(k);save();summary()}function guide(){view='guide';tabs();$('#content').innerHTML='<div class="eyebrow">How to use</div><h2 style="font:29px Georgia;margin:10px 0 18px">在自己的節奏裡練習</h2><div class="review"><h4>01　選科目與年度</h4><p>先挑想加強的考科與年度範圍，再選每回合題數。題目順序會隨機排列。</p></div><div class="review"><h4>02　作答後看解析</h4><p>選擇答案後按「確認答案」，即可查看正確答案與重點解析。完成回合會列出逐題回顧。</p></div><div class="review"><h4>03　收藏與錯題複習</h4><p>按愛心收藏題目；作答紀錄會保存在本機瀏覽器，可用「錯題複習」及「我的收藏」回顧。</p></div><div class="review"><h4>題庫來源與範圍</h4><p>本練習依參考資料夾內歷年建築師高考六科 PDF 常見觀念，整理為 30 題自編選擇練習，並非完整重製歷屆原題；選項與解析為學習用途整理。建築法規請核對現行條文；設計與申論題仍建議用原始題本練習完整書寫與圖面。</p><p>參考資料包含歷年建築師考試題本及部分科目答案 PDF。</p></div>'}function render(){if(view==='quiz')round.length?quiz():empty();else if(view==='summary')summary();else guide()}init();
</script></body></html>
