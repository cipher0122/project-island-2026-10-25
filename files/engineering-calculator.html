<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 工程計算機</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#173653,#07111f 48%,#030812);color:#eef8ff;font:14px system-ui,"Noto Sans TC",sans-serif}.app{width:min(900px,92vw);display:grid;grid-template-columns:1fr 240px;gap:20px}.calc{padding:20px;border-radius:24px;background:linear-gradient(145deg,#17304b,#081322);box-shadow:18px 20px #020812,0 30px 70px #0008;transform:perspective(1200px) rotateX(2deg) rotateY(-2deg)}h1{margin:0 0 12px;font-size:36px}.sub{color:#8ca5bd}.display{background:#06101a;border:1px solid #24455b;border-radius:15px;padding:14px;margin-bottom:16px;text-align:right}.display small{display:flex;justify-content:space-between;color:#8ca5bd}.angle{color:#b8f36a;cursor:pointer}#expr{height:26px;color:#8db1c9}#result{font-size:44px;font-weight:700;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.key,.tool{min-height:50px;border:0;border-radius:11px;color:#eef8ff;background:linear-gradient(145deg,#203b57,#102238);box-shadow:5px 6px #06101c;cursor:pointer;font-weight:650}.key:active{transform:translate(3px,4px)}.fn{color:#68e5ff}.op{color:#ffae62;font-size:20px}.eq{color:#07111f;background:#b8f36a;grid-row:span 2}.wide{grid-column:span 2}.panel{background:#0e1c2ed9;border:1px solid #1f3a54;border-radius:18px;padding:16px}.panel h2{font-size:14px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{min-height:38px;font-size:12px}.hint{color:#8ca5bd;font-size:12px;line-height:1.6}.hist{border-left:2px solid #2d566e;padding:7px;color:#b8f36a}.hist span{display:block;color:#8ca5bd;font-size:11px}@media(max-width:700px){.app{grid-template-columns:1fr}.panel{margin-top:14px}}</style><main class="app"><section><h1>ENGINEERING CUBE</h1><div class="sub">3D 工程計算機 · 離線單機版</div><div class="calc"><div class="display"><small><span id="mem">M: 0</span><span class="angle" id="angle">DEG</span></small><div id="expr">準備就緒</div><div id="result">0</div></div><div class="keys"><button class="key" data-a="c">AC</button><button class="key" data-a="b">⌫</button><button class="key" data-a="mc">MC</button><button class="key" data-a="mr">MR</button><button class="key op" data-v="÷">÷</button><button class="key fn" data-v="sin(">sin</button><button class="key fn" data-v="cos(">cos</button><button class="key fn" data-v="tan(">tan</button><button class="key fn" data-v="sqrt(">√</button><button class="key op" data-v="×">×</button><button class="key fn" data-v="log(">log</button><button class="key fn" data-v="ln(">ln</button><button class="key fn" data-v="π">π</button><button class="key fn" data-v="^">xʸ</button><button class="key op" data-v="-">−</button><button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key fn" data-v="(">(</button><button class="key op" data-v="+">+</button><button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key fn" data-v=")">)</button><button class="key eq" data-a="e">=</button><button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key fn" data-v="%">%</button><button class="key wide" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key" data-a="s">±</button></div></div></section><aside><div class="panel"><h2>工程工具箱</h2><button class="tool" id="save">記憶目前值</button> <button class="tool" id="copy">複製結果</button><p class="hint" id="hint">支援三角函數、對數、次方、百分比與 π。點 DEG 切換 RAD。</p></div><div class="panel"><h2>計算歷史</h2><div id="history" class="hint">尚無紀錄</div></div></aside></main><script>let x='',a=0,m=0,mode='DEG',h=[];const q=s=>document.querySelector(s),raw=s=>String(s).replaceAll(',',''),f=n=>{if(!Number.isFinite(n))return 'Error';return Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:12})},show=s=>String(s).replace(/\\d+(?:\\.\\d+)?/g,n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:12}));function d(){q('#expr').textContent=x?show(x):'準備就緒';q('#result').textContent=f(a);q('#mem').textContent='M: '+f(m);q('#angle').textContent=mode}function ev(s){s=raw(s);s=s.replaceAll('×','*').replaceAll('÷','/').replace(/[−–—]/g,'-').replaceAll('π','Math.PI').replaceAll('^','**').replace(/%/g,'/100').replace(/sqrt\(/g,'Math.sqrt(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(');let t=mode==='DEG'?'*Math.PI/180':'';s=s.replace(/sin\(([^()]*)\)/g,(_,v)=>'Math.sin('+v+t+')').replace(/cos\(([^()]*)\)/g,(_,v)=>'Math.cos('+v+t+')').replace(/tan\(([^()]*)\)/g,(_,v)=>'Math.tan('+v+t+')');return Function('return '+s)()}function eq(){try{let z=ev(x);h.unshift([x,z]);q('#history').innerHTML=h.slice(0,10).map(v=>'<div class="hist"><span>'+v[0]+'</span>= '+f(v[1])+'</div>').join('');a=z;x='';d()}catch{q('#result').textContent='Error'}}document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{let v=b.dataset.v,z=b.dataset.a;if(v)x+=v;if(z==='e')eq();if(z==='c'){x='';a=0}if(z==='b')x=x.slice(0,-1);if(z==='s')x=x?'-('+x+')':'';if(z==='mc')m=0;if(z==='mr')x+=raw(f(m));d()});q('#angle').onclick=()=>{mode=mode==='DEG'?'RAD':'DEG';d()};q('#save').onclick=()=>{m=a;d()};q('#copy').onclick=()=>{navigator.clipboard?.writeText(f(a));q('#hint').textContent='結果已複製。'};document.addEventListener('keydown',e=>{if(/[0-9.()+\-*/%]/.test(e.key)){x+=({'*':'×','/':'÷','-':'-'}[e.key]||e.key);d()}else if(e.key==='Enter')eq();else if(e.key==='Backspace'){x=x.slice(0,-1);d()}else if(e.key==='Escape'){x='';a=0;d()}});d()</script></html>
