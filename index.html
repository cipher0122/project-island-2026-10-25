function layout(){const small=matchMedia('(max-width:800px)').matches;document.querySelector('.map svg').setAttribute('viewBox',small?'0 0 480 920':'0 0 1100 850');document.querySelectorAll('.island').forEach((e,i)=>e.setAttribute('transform',small?'translate('+(125+(i%2)*230)+' '+(110+Math.floor(i/2)*210)+')':'translate('+(projects[i].x+60)+' '+(projects[i].y+50)+')'));}layout();window.addEventListener('resize',layout);let returnFocus=null;
function close(){ $('#detail').classList.add('hidden'); document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));returnFocus?.focus();}
function show(id){returnFocus=document.activeElement;const p=projects[id];document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));document.querySelector(`.island[data-id="${id}"]`).classList.add('selected');const main=p.files.find(f=>f.url.endsWith('.html'))||p.files.find(f=>f.url.endsWith('.xlsx'));$('#detail').innerHTML=`<button class="close" aria-label="關閉詳細資料">×</button><span class="tag">ISLAND 0${id+1} / ${p.cat}</span><h2>${p.title}</h2><p><strong>${p.tag}</strong></p><p>${p.desc}</p>${main?`<a class="primary" href="${encodeURI(main.url)}" target="_blank" rel="noopener">開啟${main.url.endsWith('.html')?'專案網頁':'名片資料庫'} ↗</a>`:''}<div class="count">${p.files.length?`${p.files.length} 個檔案 · 不含舊版備份`:'待補成果'}</div>${p.files.length?'<input class="file-search" aria-label="搜尋成果檔案" placeholder="搜尋檔名、年度、科目…"><div class="files"></div>':'<div class="empty">這座島已預留，期待下一份作品登陸。</div>'}`;$('#detail').classList.remove('hidden');$('.close').onclick=close;function files(q=''){const rows=p.files.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));$('.files').innerHTML=rows.length?rows.map(f=>`<a href="${encodeURI(f.url)}" target="_blank" rel="noopener">${esc(f.name)} ↗</a>`).join(''):'<p>找不到符合的檔案，請換個關鍵字。</p>';}if(p.files.length){files();$('.file-search').oninput=e=>files(e.target.value);}$('.close').focus();}
document.querySelectorAll('.island').forEach(e=>{e.onclick=()=>show(+e.dataset.id);e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();show(+e.dataset.id);}};});
function render(q=''){const found=projects.filter(p=>(p.title+p.cat+p.desc).toLowerCase().includes(q.toLowerCase()));$('#matches').textContent=found.length+' / 8 座島';$('#grid').innerHTML=found.length?found.map(p=>`<button class="card" data-project="${p.id}" style="border-top:5px solid ${p.color}"><small>0${p.id+1} / ${p.cat}${p.files.length?'':' / 待補成果'}</small><h3>${p.title} ↗</h3><p>${p.tag}</p></button>`).join(''):'<p>沒有符合的專案，請嘗試其他關鍵字。</p>';document.querySelectorAll('[data-project]').forEach(e=>e.onclick=()=>show(+e.dataset.project));}render();$('#search').oninput=e=>render(e.target.value);
$('#view').onclick=()=>{const list=$('#list').classList.toggle('hidden');$('#map').classList.toggle('hidden',!list);$('#view').setAttribute('aria-pressed',String(!list));$('#view').textContent=list?'☰ 專案清單':'⌖ 島嶼地圖';$('#detail').classList.add('hidden');};$('#routes').onclick=()=>{const hidden=$('#routeLayer').classList.toggle('hidden');$('#routes').setAttribute('aria-pressed',String(!hidden));};$('#home').onclick=()=>{$('#list').classList.add('hidden');$('#map').classList.remove('hidden');$('#detail').classList.add('hidden');$('#view').setAttribute('aria-pressed','false');$('#view').textContent='☰ 專案清單';window.scrollTo(0,0);};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#detail').classList.contains('hidden'))close();});
